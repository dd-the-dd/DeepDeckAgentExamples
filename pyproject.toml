[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepdeck-learner"
version = "0.2.0"
description = "Train, inspect, and locally playtest public Deep Deck AI examples"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deep Deck League" }]
dependencies = [
  "deepdeck-agent-sdk>=0.1.0",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.0,<2",
  "psutil>=6,<8",
  "uvicorn>=0.35,<0.36",
]

[project.optional-dependencies]
deep-learning = [
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "torch>=2.4,<2.9; sys_platform == 'win32'",
  "torch>=2.4,<3; sys_platform != 'win32'",
  "websockets>=15,<18",
]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "types-psutil>=7,<8",
  "types-PyYAML>=6,<7",
]

[project.scripts]
deepdeck-example = "deepdeck_examples.run:main"
deepdeck-train = "deepdeck_examples.deep_learning.training:main"
deepdeck-learner = "deepdeck_learner.cli:main"
oracle-ai-train = "oracle_ai.training.cli:main"
oracle-ai-league-train = "oracle_ai.training.league:main"
oracle-ai-ground-truth-eval = "oracle_ai.ground_truth_cli:main"
oracle-ai-calibrate-anchors = "oracle_ai.training.anchor_calibration:main"
oracle-ai-v12-clients = "oracle_ai.agents.v12_clients:main"
oracle-ai-v13-world-model = "oracle_ai.training.world_model:main"
oracle-ai-v15-world-model = "oracle_ai.training.world_model_v15:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepdeck_examples", "src/deepdeck_learner", "src/oracle_ai"]

[tool.hatch.build.targets.wheel.force-include]
"apps/learner-web/dist" = "deepdeck_learner/web"
"configs/oracle-ai" = "oracle_ai/configs"

[tool.hatch.build.targets.sdist.force-include]
"apps/learner-web/dist" = "apps/learner-web/dist"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/oracle_ai/**/*.py" = ["B023", "B905", "E501", "SIM905"]
"tests/oracle_ai/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepdeck_examples", "deepdeck_learner"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"
